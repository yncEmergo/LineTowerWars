; Export presets for LTW_Test. Committed on purpose: it is project configuration,
; and it carries no credentials.
;
; The export path is RELATIVE, so it resolves against whichever checkout it is
; run from and never names one machine's disk. It points OUTSIDE the project so
; build output cannot land in the Godot filesystem and be imported back.
;
; The client preset must NOT set dedicated_server: Boot reads that feature tag to
; decide what this process is, so a client build carrying it would open the
; server scene and never show a menu.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/godotsteam/*, ReferenceFilesFromOtherProjects/*"
export_path="../Builds/Windows/LTW_Test.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/icon="res://2DArt/Icons/ultimate_firelord.png"
application/console_wrapper_icon="res://2DArt/Icons/ultimate_firelord.png"
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name=""
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script=""
ssh_remote_deploy/cleanup_script=""
